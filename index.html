<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dust Cleaner Simulator</title>
<link rel="stylesheet" href="game.css">
<script defer src="renderer.js"></script>
<script defer src="room.js"></script>
<script defer src="audio.js"></script>
<script defer src="game.js"></script>
</head>
<body>
  <canvas id="room" aria-label="Комната для уборки"></canvas>

  <div id="hud">
    <section id="progress" class="progress" aria-label="Прогресс уборки" hidden>
      <div class="progress-row" data-progress="floor" hidden><span>Пол</span><progress max="100" value="0" aria-label="Пол"></progress><output>0%</output></div>
      <div class="progress-row" data-progress="carpet" hidden><span>Ковёр</span><progress max="100" value="0" aria-label="Ковёр"></progress><output>0%</output></div>
      <div class="progress-row" data-progress="cabinet" hidden><span>Тумба</span><progress max="100" value="0" aria-label="Тумба"></progress><output>0%</output></div>
      <div class="progress-row" data-progress="bed" hidden><span>Кровать</span><progress max="100" value="0" aria-label="Кровать"></progress><output>0%</output></div>
      <div class="progress-row" data-progress="windowSill" hidden><span>Подоконник</span><progress max="100" value="0" aria-label="Подоконник"></progress><output>0%</output></div>
      <div class="progress-row" data-progress="desk" hidden><span>Стол</span><progress max="100" value="0" aria-label="Стол"></progress><output>0%</output></div>
    </section>

    <div id="reticle" aria-hidden="true"></div>
    <div class="equipment">
      <div class="tools" aria-label="Инструменты">
        <span class="tool" data-tool="0" aria-current="true" role="img" aria-label="Пылесос">
          <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M27 4 L17 27" stroke="#9aa3b2" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="5" y="26" width="24" height="8" rx="3" fill="#e0524f"/><rect x="6" y="33" width="22" height="3" rx="1.5" fill="#3a3f4a"/></svg>
        </span>
        <span class="tool" data-tool="1" role="img" aria-label="Тряпка">
          <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 12 Q14 7 21 11 T34 10 L33 29 Q26 33 19 29 T6 30 Z" fill="#f2c94c"/><path d="M11 17 Q18 14 25 18 M10 23 Q18 20 28 24" stroke="#d6a52c" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </span>
        <span class="tool" data-tool="2" role="img" aria-label="Щётка">
          <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="17" y="3" width="6" height="16" rx="3" fill="#8a5a33"/><rect x="7" y="17" width="26" height="9" rx="3" fill="#b5713f"/><path d="M9 26v9M12 26v9M15 26v9M18 26v9M21 26v9M24 26v9M27 26v9M30 26v9" stroke="#e8d9b8" stroke-width="2"/></svg>
        </span>
        <span class="tool hint" id="dust-hint" role="img" aria-label="Подсветить оставшуюся пыль">
          <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="17" cy="17" r="10" fill="rgba(255,194,61,.25)" stroke="#ffc23d" stroke-width="4"/><path d="M25 25 L34 34" stroke="#ffc23d" stroke-width="5" stroke-linecap="round"/><circle cx="14" cy="14" r="2.5" fill="#fff6d8"/></svg>
        </span>
      </div>
    </div>
  </div>

  <div id="overlay">
    <section class="panel" aria-labelledby="overlay-title">
      <h1 id="overlay-title">Уборка пыли</h1>
      <p id="overlay-summary">Убери пыль с пола, ковра и мебели.</p>
      <button id="play" type="button">Начать уборку</button>
      <p class="controls"><kbd>WASD</kbd> ходьба <span>·</span> мышь обзор <span>·</span> ЛКМ уборка <span>·</span> колёсико или <kbd>1–3</kbd> инструменты <span>·</span> <kbd>Q</kbd> пыль <span>·</span> <kbd>Esc</kbd> пауза</p>
      <p id="error" role="alert" hidden></p>
    </section>
  </div>
</body>
</html>
